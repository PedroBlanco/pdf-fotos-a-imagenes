[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-fotos-a-imagenes"
version = "0.1.0"
description = "Extrae y endereza fotografías de documentos PDF escaneados"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "pypdfium2>=5.12.1,<6",
]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
pdf-fotos-a-imagenes = "pdf_fotos_a_imagenes.main:cli"

[project.optional-dependencies]
dev = [
  "mypy>=1.16",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/autocrop"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pdf_fotos_a_imagenes"]
mypy_path = "src"
