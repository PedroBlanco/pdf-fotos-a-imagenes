[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-fotos-a-imagenes"
version = "0.1.0"
description = "Proyecto pdf-fotos-a-imagenes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "mit" }
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.16",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pdf_fotos_a_imagenes"]
mypy_path = "src"
